packages:
  - apps/*
  - packages/*
  - scripts

# Packages allowed to run install scripts. `electron` and `esbuild` download
# their binaries; `electron-winstaller` (a dependency of electron-builder) runs
# `select-7z-arch.js` to pick the 7z used to build the NSIS installer.
#
# Two spellings: pnpm 10 reads `onlyBuiltDependencies`, pnpm 11 renamed it to
# `allowBuilds` and ignores the old key (agreeing on the same three packages).
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - koffi
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true

# The speech binding is JavaScript. Native inference is installed on
# demand into userData, never collected as a production dependency.
overrides:
  'transcribe-cpp>@transcribe-cpp/darwin-x64-cpu': '-'
  'transcribe-cpp>@transcribe-cpp/darwin-arm64-metal': '-'
  'transcribe-cpp>@transcribe-cpp/linux-x64-cpu-vulkan': '-'
  'transcribe-cpp>@transcribe-cpp/win32-x64-cpu-vulkan': '-'
  'transcribe-cpp>@transcribe-cpp/linux-arm64-cpu-vulkan': '-'
