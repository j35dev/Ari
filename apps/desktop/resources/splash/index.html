<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ari — Awakening</title>
<style>
  :root{
    --bg:#070709;
    --bg2:#0d0d10;
    --ink:#f3f0e8;
    --gold:#e98b24;
    --muted:rgba(243,240,232,.46);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  body{display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .stage{
    position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate;
    background:
      radial-gradient(55% 45% at 50% 45%, rgba(233,139,36,.065), transparent 70%),
      radial-gradient(35% 35% at 50% 52%, rgba(255,255,255,.018), transparent 72%),
      var(--bg);
  }
  .grain{
    position:absolute;inset:-25%;pointer-events:none;opacity:.035;z-index:1;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  }
  .bloom{
    position:absolute;left:50%;top:49%;width:min(72vw,920px);height:min(72vw,920px);
    transform:translate(-50%,-50%) scale(.76);border-radius:50%;
    background:radial-gradient(circle, rgba(233,139,36,.11), rgba(233,139,36,.025) 32%, transparent 71%);
    filter:blur(16px);opacity:0;animation:bloom 1.8s cubic-bezier(.2,.75,.2,1) .05s forwards;z-index:0;
  }
  .spark-wrap{
    position:absolute;left:50%;top:50%;width:18px;height:18px;
    transform:translate(-50%,-50%);z-index:5;
    animation:spark-travel 1.55s cubic-bezier(.2,.82,.18,1) forwards;
  }
  .spark{
    width:100%;height:100%;opacity:0;transform:scale(.12);
    animation:spark-pop .7s cubic-bezier(.18,1.35,.3,1) .15s forwards;
    filter:drop-shadow(0 0 10px rgba(233,139,36,.25));
  }
  .logo{
    position:absolute;left:50%;top:48.5%;width:min(47vw,500px);aspect-ratio:1;
    transform:translate(-50%,-50%) scale(.86);opacity:0;z-index:4;
    animation:logo-rise 1.15s cubic-bezier(.18,.82,.18,1) .63s forwards;
  }
  .logo svg{width:100%;height:100%;display:block;overflow:visible}
  .arc{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw-arc 1.35s cubic-bezier(.2,.78,.18,1) .64s forwards}
  .horizon{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw-horizon 1.08s cubic-bezier(.2,.82,.18,1) 1.08s forwards}
  .a-shape{opacity:0;transform-origin:center;transform:translateY(17px) scale(.965);animation:a-reveal .9s cubic-bezier(.18,.86,.18,1) 1.26s forwards}
  .star{opacity:0;transform-origin:center;animation:star-reveal .66s cubic-bezier(.18,1.42,.3,1) 1.66s forwards}
  .wordmark{opacity:0;transform:translateY(9px);animation:wordmark-reveal .72s cubic-bezier(.18,.82,.2,1) 1.93s forwards}
  .caption{
    position:absolute;left:50%;top:calc(50% + min(29vw,300px));transform:translateX(-50%);
    text-align:center;z-index:6;opacity:0;animation:caption .6s cubic-bezier(.18,.82,.18,1) 2.10s forwards;
    letter-spacing:.32em;text-transform:uppercase;font-size:9px;color:var(--muted);white-space:nowrap
  }
  .veil{
    position:absolute;inset:0;z-index:10;pointer-events:none;background:var(--bg);
    opacity:0;transform:scaleY(0);transform-origin:50% 100%;
  }
  .veil.on{opacity:1;transform:scaleY(1);transition:transform .5s cubic-bezier(.22,.9,.22,1),opacity .16s ease}
  .logo.finish{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1)}
  .logo.finish.pop{transform:translate(-50%,-50%) scale(1.09);opacity:0;transition:transform .42s cubic-bezier(.18,.85,.18,1),opacity .34s ease}

  @keyframes bloom{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes spark-pop{
    0%{opacity:0;transform:scale(.12)} 28%{opacity:1;transform:scale(1.06)}
    58%{opacity:1;transform:scale(.82)} 100%{opacity:1;transform:scale(1)}
  }
  @keyframes spark-travel{
    0%{transform:translate(-50%,-50%) translate(0,0)}
    55%{transform:translate(-50%,-50%) translate(82px,-106px)}
    100%{transform:translate(-50%,-50%) translate(132px,-51px)}
  }
  @keyframes logo-rise{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.86)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  }
  @keyframes draw-arc{to{stroke-dashoffset:0}}
  @keyframes draw-horizon{to{stroke-dashoffset:0}}
  @keyframes a-reveal{to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes star-reveal{
    0%{opacity:0;transform:scale(.12) rotate(-18deg)}
    70%{opacity:1;transform:scale(1.12) rotate(0)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }
  @keyframes wordmark-reveal{to{opacity:1;transform:translateY(0)}}
  @keyframes caption{to{opacity:1;transform:translateX(-50%)}}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0!important;transition:none!important}
    .logo,.bloom,.caption{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .caption{transform:translateX(-50%)}
    .arc,.horizon{stroke-dashoffset:0}
    .a-shape,.star,.wordmark{opacity:1;transform:none}
  }
</style>
</head>
<body>
<main class="stage" aria-label="Ari startup animation">
  <div class="grain"></div>
  <div class="bloom"></div>

  <div class="spark-wrap" aria-hidden="true">
    <svg class="spark" viewBox="0 0 40 40">
      <path d="M20 0C22 12 28 18 40 20C28 22 22 28 20 40C18 28 12 22 0 20C12 18 18 12 20 0Z" fill="var(--gold)"/>
    </svg>
  </div>

  <div class="logo" id="logo">
    <svg viewBox="0 0 520 520" role="img" aria-label="ARI">
      <path class="arc" d="M116 284 A146 146 0 1 1 404 284" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round"/>
      <path class="horizon" d="M58 322 Q260 224 462 322" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>
      <g class="a-shape" fill="var(--ink)">
        <path d="M167 355 L246 112 L276 112 L353 355 L315 355 L295 288 L227 288 L207 355 Z"/>
        <path d="M237 254 L285 254 L261 178 Z" fill="var(--bg)"/>
      </g>
      <path class="star" d="M355 142C357 158 364 165 380 168C364 171 357 178 355 194C353 178 346 171 330 168C346 165 353 158 355 142Z" fill="var(--gold)"/>
      <g class="wordmark" fill="var(--ink)">
        <text x="260" y="437" text-anchor="middle" font-size="50" font-weight="600" letter-spacing="18" font-family="Inter,Arial,sans-serif">ARI</text>
      </g>
    </svg>
  </div>

  <div class="caption">AGENT DEVELOPMENT ENVIRONMENT</div>
  <div class="veil" id="veil"></div>
</main>

<script>
  const logo=document.getElementById('logo');
  const veil=document.getElementById('veil');
  let appReady=false, minTimeDone=false, finished=false, audioStarted=false;

  function tone(ctx, start, duration, freq, type='sine', gain=.04, ramp=true){
    const osc=ctx.createOscillator();
    const g=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(gain, start+.018);
    g.gain.exponentialRampToValueAtTime(.0001, start+duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(start); osc.stop(start+duration+.02);
  }

  function playAriSound(){
    if(audioStarted) return;
    audioStarted=true;
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const now=ctx.currentTime+.02;

      // Very soft "awakening" texture: breath + three-note lift + final shimmer.
      const filter=ctx.createBiquadFilter();
      filter.type='lowpass'; filter.frequency.value=1800; filter.Q.value=.4;

      const noise=ctx.createBufferSource();
      const buffer=ctx.createBuffer(1, ctx.sampleRate*.42, ctx.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,1.7)*.20;
      noise.buffer=buffer;

      const ng=ctx.createGain();
      ng.gain.setValueAtTime(.0001,now);
      ng.gain.linearRampToValueAtTime(.045,now+.16);
      ng.gain.exponentialRampToValueAtTime(.0001,now+.40);
      noise.connect(filter).connect(ng).connect(ctx.destination);
      noise.start(now);

      tone(ctx,now+.55,.65,261.63,'sine',.028);  // C
      tone(ctx,now+.67,.72,329.63,'sine',.030);  // E
      tone(ctx,now+.80,.92,392.00,'sine',.026);  // G

      const shimmer=ctx.createOscillator();
      const sg=ctx.createGain();
      shimmer.type='sine';
      shimmer.frequency.setValueAtTime(880,now+1.28);
      shimmer.frequency.exponentialRampToValueAtTime(1320,now+1.72);
      sg.gain.setValueAtTime(.0001,now+1.28);
      sg.gain.linearRampToValueAtTime(.022,now+1.38);
      sg.gain.exponentialRampToValueAtTime(.0001,now+1.82);
      shimmer.connect(sg).connect(ctx.destination);
      shimmer.start(now+1.28); shimmer.stop(now+1.84);

      setTimeout(()=>ctx.close().catch(()=>{}),2400);
    }catch(e){}
  }

  function finishIfReady(){
    if(finished || !appReady || !minTimeDone) return;
    finished=true;
    logo.classList.add('finish');
    requestAnimationFrame(()=>requestAnimationFrame(()=>logo.classList.add('pop')));
    setTimeout(()=>veil.classList.add('on'),180);
    setTimeout(()=>window.dispatchEvent(new Event('ARI_SPLASH_DONE')),650);
  }

  playAriSound();

  // Long enough to breathe, still short enough to feel like startup.
  setTimeout(()=>{minTimeDone=true;finishIfReady()},3300);

  window.finishAriSplash=()=>{
    appReady=true;
    finishIfReady();
  };

  // Standalone preview fallback.
  setTimeout(()=>{appReady=true;finishIfReady()},3900);
</script>
</body>
</html>
