# electron-builder packaging config for Ari desktop (M14.1–M14.3).
# Build from apps/desktop after `electron-vite build`; see scripts/README-packaging.md.
$schema: https://raw.githubusercontent.com/electron-userland/electron-builder/master/scheme.json
appId: com.ari.desktop
productName: Ari
# The Linux executable name is derived from the package name (@ari/desktop)
# unless set here; '@' is not a legal character in AppImage/deb paths.
executableName: ari
icon: build/icon.png
directories:
  output: ../../dist
files:
  - out/**
  - package.json
# node-pty is the only native dependency; it must stay physical on disk
# (Electron ABI build) or ConPTY/Unix PTY loading fails inside asar.
asarUnpack:
  - '**/node_modules/@lydell/node-pty/**'
win:
  target:
    - nsis
  # Signing scaffolding: electron-builder auto-picks up CSC_LINK /
  # CSC_KEY_PASSWORD (or a cert subject name via `sign`) when provided.
  # Certificate procurement is deferred — see PLAN M14.1.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Ari-Setup-${version}.exe
mac:
  target:
    - target: dmg
      arch:
        - universal
    # electron-updater on macOS consumes the zip, not the dmg.
    - target: zip
      arch:
        - universal
  category: public.app-category.developer-tools
  artifactName: Ari-${version}-universal.${ext}
linux:
  target:
    - AppImage
    - deb
  # Derives from the package name otherwise, yielding an unwritable
  # dist/@ari/... path for the deb.
  artifactName: Ari-${version}.${ext}
  category: Development
  maintainer: dev@ari.local
# Auto-updates check GitHub releases (see src/main/updater.ts).
publish:
  provider: github
  owner: tahacore
  repo: Ari
