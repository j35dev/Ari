# electron-builder packaging config for Ari desktop (M14.1–M14.3).
# Build from apps/desktop after `electron-vite build`; see scripts/README-packaging.md.
$schema: https://raw.githubusercontent.com/electron-userland/electron-builder/master/scheme.json
appId: com.ari.desktop
productName: Ari
# The Linux executable name is derived from the package name (@ari/desktop)
# unless set here; '@' is not a legal character in AppImage/deb paths.
executableName: ari
icon: build/icon.png
# Native dependencies ship Node-API prebuilds for each target; rebuilding the
# hook would require a platform compiler without changing its Electron ABI.
npmRebuild: false
directories:
  output: ../../dist
files:
  - out/**
  - package.json
  # Debug symbols for the pty prebuilds: ~10MB per win32 arch, never loaded.
  - '!**/node_modules/@lydell/node-pty-*/prebuilds/**/*.pdb'
  - '!**/node_modules/@transcribe-cpp/**'
extraResources:
  - from: resources/cli
    to: agent-cli
  # The phone's PWA, served by the gateway under Tailscale (see mobileWebRoot).
  # Built by `@ari/mobile`; the `dist` script builds it before packing, and
  # afterPack fails the build when it is missing.
  - from: ../mobile/dist
    to: mobile
  # Tiny music-helper manifest (no binaries): the Focus engine downloads
  # only the host target into application data on first use.
  - from: resources/music-runtime.json
    to: music-runtime.json
  # Runtime tray assets. Windows gets a multi-resolution ICO so the Ari mark
  # stays sharp at every notification-area DPI scale.
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  # Licenses of the third-party code inside Ari; regenerate with
  # `node scripts/third-party-notices.mjs` before a release.
  - from: ../../THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
# Native dependencies must stay physical on disk
# (ConPTY needs to dlopen conpty.node and spawn OpenConsole.exe, neither of
# which works from inside an asar archive). `@lydell/node-pty` is only a
# resolver stub — the implementation and the binaries live in the
# platform-specific `@lydell/node-pty-<platform>-<arch>` package it requires,
# so both must be unpacked.
asarUnpack:
  - '**/node_modules/sherpa-onnx-*/**'
  - '**/node_modules/@koromix/koffi-*/**'
  - '**/node_modules/koffi/**'
  - '**/node_modules/@lydell/node-pty/**'
  - '**/node_modules/@lydell/node-pty-*/**'
  # Node-API keyboard-hook prebuilds are loaded by node-gyp-build at runtime.
  - '**/node_modules/uiohook-napi/**'
  - '**/node_modules/node-gyp-build/**'
# Electron fuses, flipped in the packaged binary before signing.
# - runAsNode stays on: the agent CLI shims, the browser MCP proxy, the Claude
#   driver and audio ducking all spawn this executable with ELECTRON_RUN_AS_NODE.
# - NODE_OPTIONS and --inspect are ignored, so neither an inherited environment
#   variable nor a command-line flag can inject code or attach a debugger.
# - The app loads only from app.asar, never a loose resources/app folder.
# - Cookie encryption is left as it is: turning it on would sign every user out
#   of the sites they logged into in the in-app browser.
# - Embedded asar integrity is not enabled: Electron checks it on macOS and
#   Windows only, and the universal macOS app (split per-arch asars) cannot be
#   verified without a Mac.
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# Fails the build if the platform pty package did not survive dependency
# collection — that regression ships a terminal that opens to a dead cursor.
afterPack: ./packaging/after-pack.js
win:
  target:
    - nsis
  # Only the x64 installer is built, and it never loads the arm64 ConPTY
  # payload. On the hosted runner NSIS extraction also drops that payload's
  # conpty/ folder, so the installed tree would differ from the tested one.
  files:
    - '!**/node_modules/sherpa-onnx-{darwin,linux}-*/**'
    - '!**/node_modules/sherpa-onnx-win-{arm64,ia32}/**'
    - '!**/node_modules/@lydell/node-pty-win32-arm64/**'
  # Signing scaffolding: electron-builder auto-picks up CSC_LINK /
  # CSC_KEY_PASSWORD (or a cert subject name via `sign`) when provided.
  # Certificate procurement is deferred — see PLAN M14.1.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Ari-Setup-${version}.exe
mac:
  files:
    - '!**/node_modules/sherpa-onnx-{win,linux}-*/**'
  target:
    - target: dmg
      arch:
        - universal
    # electron-updater on macOS consumes the zip, not the dmg.
    - target: zip
      arch:
        - universal
  category: public.app-category.developer-tools
  # No paid Apple certificate: ad-hoc sign ('-') so the arm64 slice runs at
  # all once its fuses are flipped. Ad-hoc builds cannot be notarized, and
  # Squirrel.Mac will not install updates to them (see src/main/updater.ts).
  identity: '-'
  notarize: false
  # Signing uses electron-builder's hardened runtime; the entitlements keep
  # library validation off, which an ad-hoc signature needs.
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  artifactName: Ari-${version}-universal.${ext}
  # A universal app is packed as an x64 slice and an arm64 slice which are then
  # merged. Both slices carry every native prebuild (plain dependencies, so
  # electron-builder cannot host-filter them away), which makes each prebuild
  # binary byte-identical in both — and @electron/universal refuses an identical
  # Mach-O in both slices unless it is declared here. These are single-arch
  # addons that the resolver stub picks at runtime, so copying them verbatim is
  # exactly right; there is nothing to lipo together.
  x64ArchFiles: '**/node_modules/{@lydell/node-pty-*,@koromix/koffi-*,sherpa-onnx-*,uiohook-napi}/**'
  extendInfo:
    NSMicrophoneUsageDescription: Ari uses your microphone for local speech to text.
linux:
  files:
    - '!**/node_modules/sherpa-onnx-{win,darwin}-*/**'
  target:
    - AppImage
    - deb
  # Derives from the package name otherwise, yielding an unwritable
  # dist/@ari/... path for the deb.
  artifactName: Ari-${version}.${ext}
  category: Development
  maintainer: dev@ari.local
# Auto-updates check GitHub releases (see src/main/updater.ts).
publish:
  provider: github
  owner: j35dev
  repo: Ari
