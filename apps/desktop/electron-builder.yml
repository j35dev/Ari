# electron-builder packaging config for Ari desktop (M14.1–M14.3).
# Build from apps/desktop after `electron-vite build`; see scripts/README-packaging.md.
$schema: https://raw.githubusercontent.com/electron-userland/electron-builder/master/scheme.json
appId: com.ari.desktop
productName: Ari
# The Linux executable name is derived from the package name (@ari/desktop)
# unless set here; '@' is not a legal character in AppImage/deb paths.
executableName: ari
icon: build/icon.png
directories:
  output: ../../dist
files:
  - out/**
  - package.json
  # Debug symbols for the pty prebuilds: ~10MB per win32 arch, never loaded.
  - '!**/node_modules/@lydell/node-pty-*/prebuilds/**/*.pdb'
extraResources:
  - from: resources/cli
    to: agent-cli
  # Runtime tray assets. Windows gets a multi-resolution ICO so the Ari mark
  # stays sharp at every notification-area DPI scale.
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
# ACP adapters run as ESM through Electron's Node mode. Their entire runtime
# dependency graph must be physical: ESM resolution does not use NODE_PATH to
# find JS dependencies left in app.asar. This also covers pty and CLI binaries.
asarUnpack:
  - '**/node_modules/**'
# Fails the build if the platform pty package did not survive dependency
# collection — that regression ships a terminal that opens to a dead cursor.
afterPack: ./packaging/after-pack.js
win:
  target:
    - nsis
  # Signing scaffolding: electron-builder auto-picks up CSC_LINK /
  # CSC_KEY_PASSWORD (or a cert subject name via `sign`) when provided.
  # Certificate procurement is deferred — see PLAN M14.1.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Ari-Setup-${version}.exe
mac:
  target:
    - target: dmg
      arch:
        - universal
    # electron-updater on macOS consumes the zip, not the dmg.
    - target: zip
      arch:
        - universal
  category: public.app-category.developer-tools
  artifactName: Ari-${version}-universal.${ext}
  # A universal app is packed as an x64 slice and an arm64 slice which are then
  # merged. Both slices carry every pty prebuild (they are plain dependencies, so
  # electron-builder cannot host-filter them away), which makes each prebuild
  # binary byte-identical in both — and @electron/universal refuses an identical
  # Mach-O in both slices unless it is declared here. These are single-arch
  # addons that the resolver stub picks at runtime, so copying them verbatim is
  # exactly right; there is nothing to lipo together.
  # The optional ACP runtime packages are installed for both universal slices
  # by pnpm's supportedArchitectures matrix; preserve their x64 files in the
  # x64 half just like the single-arch pty addons above.
  x64ArchFiles: '**/node_modules/{@lydell/node-pty-*,@anthropic-ai/claude-agent-sdk-*,@openai/codex-*}/**'
linux:
  target:
    - AppImage
    - deb
  # Derives from the package name otherwise, yielding an unwritable
  # dist/@ari/... path for the deb.
  artifactName: Ari-${version}.${ext}
  category: Development
  maintainer: dev@ari.local
# Auto-updates check GitHub releases (see src/main/updater.ts).
publish:
  provider: github
  owner: tahacore
  repo: Ari
