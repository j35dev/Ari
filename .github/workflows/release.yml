# Release builds (M14): one job per OS, artifacts attached to the pushed tag's
# GitHub Release. Windows can also be built locally; macOS and Linux
# installers can only be produced on their own platforms, hence the matrix.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm --filter @ari/desktop build

      - name: Build mobile PWA
        run: pnpm --filter @ari/mobile build

      # Native addons ship Node-API prebuilds and npmRebuild is false in the
      # packaging config. install-app-deps overrides that and tries to compile
      # the keyboard hook, unnecessarily requiring X11 development headers.
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: apps/desktop

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          fail_on_unmatched_files: false
