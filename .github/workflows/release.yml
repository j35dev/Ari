# Pushing a v* tag builds Windows, macOS and Linux, checks each package starts
# and loads its native modules, then publishes one release with every installer.
# Run it by hand on any branch for a dry run: same builds and checks, no release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi
          test -f "docs/releases/$version.md" || { echo "::error::Missing docs/releases/$version.md"; exit 1; }

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Test the release checks
        run: node --test scripts/release-artifacts.test.mjs scripts/release-native-audit.test.mjs

      - name: Build desktop bundle
        run: pnpm --filter @ari/desktop build

      - name: Build mobile PWA
        run: pnpm --filter @ari/mobile build

      - name: Package
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        working-directory: apps/desktop

      # Every installer and update file is present and matches latest*.yml, and
      # the packaged app starts and loads its native modules.
      - name: Check the packages
        if: runner.os != 'Linux'
        run: node scripts/release-artifacts.mjs

      - name: Check the packages on a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a node scripts/release-artifacts.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: ari-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # Upload as a draft first so users never see a release with missing files.
      - uses: softprops/action-gh-release@v2
        with:
          name: Ari v${{ steps.version.outputs.version }}
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
          draft: true
          files: release/*
          fail_on_unmatched_files: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          if [ "$count" -ne 11 ]; then
            echo "::error::Expected 11 release files, found $count"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
