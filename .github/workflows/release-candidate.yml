name: release-candidate

on:
  workflow_call:
    inputs:
      sha:
        description: Exact tested release commit
        required: true
        type: string
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact reviewed candidate commit SHA (no publishing)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: inputs.sha != '' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/release-candidate-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Validate release gate fixtures
        env:
          RELEASE_FUNCTIONAL_FIXTURE: ${{ github.workspace }}/apps/desktop/src/main/testing/release-profile-0312.fixture.json
          RELEASE_FUNCTIONAL_TEST_ROOT: ${{ runner.temp }}/afn
        run: node --test scripts/release-native-audit.test.mjs scripts/release-artifacts.test.mjs scripts/release-macos-preflight.test.mjs scripts/release-macos-intel-diagnostic.test.mjs scripts/release-macos-arm64-diagnostic.test.mjs scripts/release-functional-smoke.test.mjs scripts/release-functional-ci.test.mjs scripts/release-install-smoke.test.mjs scripts/release-install-ci.test.mjs scripts/release-publish-assets.test.mjs
      - name: Build desktop bundle
        run: pnpm --filter @ari/desktop build
      - name: Build mobile PWA
        run: pnpm --filter @ari/mobile build
      # Node-API prebuilds are collected without install-app-deps or native rebuilds.
      - name: Package without publishing
        id: package-binary
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        working-directory: apps/desktop
      # Diagnostic only. x64 under Rosetta on the hosted ARM64 runner stalls before
      # any JS, stock Electron x64 included. Real x64 launches run on macos-intel-x64.
      - name: Diagnose macOS translated packaged runtime startup (non-blocking)
        id: translated-preflight
        if: runner.os == 'macOS'
        continue-on-error: true
        run: node scripts/release-macos-preflight.mjs
      # Pure ZIP receipt so a failed translated preflight can still pin this build.
      - name: Record universal ZIP transfer receipt
        id: universal-transfer
        if: always() && !cancelled() && runner.os == 'macOS' && steps.package-binary.outcome == 'success'
        run: node scripts/release-macos-intel-diagnostic.mjs receipt
      # macOS launches only the runner-native ARM64 slice; both slices stay in the inventory.
      - name: Verify artifact metadata and native slices
        if: runner.os != 'Linux'
        run: node scripts/release-artifacts.mjs
      - name: Install disposable Linux display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify Linux artifacts and native modules on disposable display
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/release-artifacts.mjs
      # Unpacked output has not run the deb installer ownership/mode setup.
      # Preserve Chromium sandboxing on this disposable hosted runner.
      - name: Configure packaged Linux sandbox helper on disposable runner
        if: runner.os == 'Linux'
        run: |
          test -f dist/linux-unpacked/chrome-sandbox
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          stat -c '%U:%G %a' dist/linux-unpacked/chrome-sandbox
      - name: Verify packaged first run and copied upgrade profile
        if: runner.os != 'Linux'
        timeout-minutes: 8
        env:
          RELEASE_FUNCTIONAL_CI: '1'
        run: node scripts/release-functional-ci.mjs
      - name: Verify Linux packaged profiles on disposable display
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          RELEASE_FUNCTIONAL_CI: '1'
        run: xvfb-run -a node scripts/release-functional-ci.mjs
      - name: Verify disposable installed artifacts and installed-path probes
        if: runner.os != 'Linux'
        timeout-minutes: 12
        env:
          RELEASE_FUNCTIONAL_CI: '1'
        run: node scripts/release-install-ci.mjs
      - name: Verify Linux extracted deb payload and installed-path probes
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          RELEASE_FUNCTIONAL_CI: '1'
        run: xvfb-run -a node scripts/release-install-ci.mjs
      - name: Record Windows installer signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ariCandidateVersion = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $ariCandidateInstaller = Join-Path dist ("Ari-Setup-" + $ariCandidateVersion + ".exe")
          Get-AuthenticodeSignature -LiteralPath $ariCandidateInstaller |
            Select-Object Status, StatusMessage, Path |
            ConvertTo-Json | Set-Content dist/signature.json
      - name: Record macOS signature
        if: runner.os == 'macOS'
        run: codesign --display --verbose=4 dist/mac-universal/ari.app 2> dist/signature.txt
      - name: Retain candidate artifacts and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ari-candidate-${{ matrix.os }}-${{ env.CANDIDATE_SHA }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            dist/candidate-artifacts.json
            dist/signature.*
            dist/macos-preflight.json
            dist/macos-intel-transfer.json
          if-no-files-found: error
      - name: Retain isolated functional profiles and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ari-functional-${{ matrix.os }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/ari-release-functional/**
          if-no-files-found: warn
      - name: Retain disposable install and installed-path proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ari-install-${{ matrix.os }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/ari-install-upgrade-*/**
          if-no-files-found: warn
      - name: Retain bounded macOS startup samples
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ari-macos-startup-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/ari-macos-preflight/**
          if-no-files-found: warn

  # Launches the x64 slice of the exact universal build on a real Intel runner.
  # Publication artifacts still come only from the package job.
  macos-intel-x64:
    needs: package
    if: always() && !cancelled()
    runs-on: macos-26-intel
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked tools without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check transfer pins before any launch
        run: node --test scripts/release-macos-intel-diagnostic.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: ari-candidate-macos-latest-${{ env.CANDIDATE_SHA }}
          path: dist
      - name: Diagnose the transferred universal x64 slice
        timeout-minutes: 10
        env:
          RELEASE_FUNCTIONAL_CI: '1'
        run: node scripts/release-macos-intel-diagnostic.mjs diagnose
      - name: Retain Intel x64 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ari-macos-intel-x64-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/ari-macos-intel-diagnostic/**
          if-no-files-found: warn
