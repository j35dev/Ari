name: verify

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'test/**'
      - 'refactor/**'
      - 'perf/**'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The required check on main is named exactly `verify`. A matrix job reports
  # per-OS names instead — `verify (ubuntu-latest)` and so on — which never
  # satisfies it, so the matrix runs under its own name and the aggregator at
  # the bottom of this file carries the stable one.
  platform:
    # macOS is where it breaks first: `sockaddr_un.sun_path` is 104 bytes there
    # against 108 on Linux, and Electron's userData prefix is far longer, so
    # platform-specific failures in the control transport only surface here.
    # `fail-fast: false` so a macOS failure still reports the Linux result.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No `packageManager` field in root package.json, so pin explicitly.
      # Lockfile is lockfileVersion 9.0 (pnpm >= 9); local dev runs pnpm 10.x.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + test)
        run: pnpm verify

  # Required by the `protect main` ruleset. `always()` so it still reports when
  # a platform leg fails or is cancelled, and fails in that case rather than
  # masking it — the required check has to reflect the whole matrix.
  verify:
    if: always()
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every platform leg passed
        if: needs.platform.result != 'success'
        run: exit 1
