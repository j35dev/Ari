# Typecheck, lint and test on every supported OS; on Linux also build the
# bundles a release ships and run the browser e2e. Runs once per PR and once per
# push to main.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  platform:
    # macOS has the shortest socket paths and Windows its own paths and quoting,
    # so each OS catches failures the others miss. Keep going when one fails.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned by `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        env:
          # Hosted macOS runs out of Node's default heap on the desktop suite.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm verify

      # A bad import only the bundler resolves, or a broken PWA build, would
      # otherwise surface at release time.
      - name: Build desktop and mobile bundles
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @ari/desktop build
          pnpm --filter @ari/mobile build

      # Vitest does not collect `*.e2e.ts`; this drives a real Electron window.
      - name: Browser input e2e
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a pnpm --filter @ari/desktop e2e

  # The `protect main` ruleset requires a check named exactly `verify`; a matrix
  # reports per-OS names, so this job carries the one name for all of them.
  verify:
    if: always()
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - name: Every OS passed
        run: |
          if [ "${{ needs.platform.result }}" != "success" ]; then
            echo "::error::A platform job ${{ needs.platform.result }}. Open the run for the failing OS; a job cancelled before any step ran needs a re-run, not a fix."
            exit 1
          fi
